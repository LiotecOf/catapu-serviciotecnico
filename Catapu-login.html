<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catapu · Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2239;--navy2:#143556;--line:#DCE5EC;--tx:#10283C;--mu:#6A7F90;--or:#FF8C00;--bl:#009FE3;--rd:#C23B22}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:15px/1.45 'Space Grotesk',system-ui,sans-serif;color:var(--tx);background:radial-gradient(1100px 560px at 15% -10%,#1B4A74 0,transparent 60%),linear-gradient(160deg,var(--navy),var(--navy2))}
.box{width:100%;max-width:410px}
.logo{display:block;width:240px;max-width:72%;height:auto;margin:0 auto 26px}
form,.tool{background:#fff;border-radius:16px;padding:30px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:5px solid var(--or)}
h1{margin:0 0 4px;font-size:23px;letter-spacing:-.3px}
p.s{margin:0 0 22px;color:var(--mu);font-size:14px}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin-bottom:6px}
.f{margin-bottom:16px;position:relative}
input[type=text],input[type=password]{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--line);border-radius:10px;color:var(--tx)}
input:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px;border-color:var(--bl)}
.ver{position:absolute;right:6px;top:29px;background:none;border:0;color:var(--bl);font:inherit;font-size:13px;font-weight:500;cursor:pointer;padding:7px 8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mu);margin:2px 0 16px;font-weight:400}
.chk input{width:16px;height:16px;accent-color:var(--or)}
.err{min-height:20px;color:var(--rd);font-size:13.5px;margin:0 0 12px}
button.ok{width:100%;padding:13px;border:0;border-radius:10px;background:var(--or);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button.ok:hover{background:#E67E00}button.ok:disabled{opacity:.6;cursor:wait}
code{display:block;word-break:break-all;background:#F3F6F9;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;margin-top:12px;user-select:all}
small{display:block;text-align:center;color:#9FB6C8;margin-top:18px;font-size:12.5px}
[hidden]{display:none!important}
</style>
</head>

  <form id="f" autocomplete="on">
    <h1>Iniciar sesión</h1>
    <p class="s">Panel interno de servicio técnico.</p>
    <div class="f"><label for="u">Usuario</label><input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
    <div class="f"><label for="p">Contraseña</label><input type="password" id="p" autocomplete="current-password" required><button type="button" class="ver" id="ver">Ver</button></div>
    <label class="chk"><input type="checkbox" id="rec"> Mantener la sesión 8 horas en este equipo</label>
    <div class="err" id="err" role="alert"></div>
    <button class="ok" id="b" type="submit">Entrar</button>
  </form>

  <form id="tool" class="tool" hidden>
    <h1>Generar contraseña</h1>
    <p class="s">Escribe el usuario y la contraseña; copia la línea resultante dentro de USUARIOS en este archivo.</p>
    <div class="f"><label for="tu">Usuario</label><input type="text" id="tu" autocapitalize="none" spellcheck="false"></div>
    <div class="f"><label for="tp">Contraseña</label><input type="text" id="tp" spellcheck="false"></div>
    <button class="ok" type="submit">Generar</button>
    <code id="out"></code>
  </form>
  <small>Uso exclusivo del personal de Catapu</small>
</div>

<script>
/* ========== CONFIGURACIÓN ==========
   USUARIOS: 'usuario': 'hash SHA-256 de  usuario:contraseña'
   Para crear o cambiar uno, abre este archivo con  ?hash  al final (Catapu-login.html?hash),
   genera la línea y pégala aquí. Usuario de prueba: catapu / Catapu2026  (cámbialo). */
const USUARIOS = {
  'catapu': '0c141a7c981b9aab9786ae643d78f2371361d9bdebdc7978d75ff6f33b580d67'
};
const PANEL = 'Catapu-panel.html', KEY = 'catapu_sesion', HORAS = 8, MAX_INTENTOS = 5, BLOQUEO_SEG = 30;

const $ = s => document.querySelector(s);
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
const sesionValida = () => { try { const s = JSON.parse(sessionStorage.getItem(KEY) || localStorage.getItem(KEY) || 'null'); return !!(s && s.exp > Date.now()) } catch { return false } };
const error = m => { $('#err').textContent = m };
const hayCrypto = () => window.crypto && crypto.subtle;

if (sesionValida()) location.replace(PANEL);
if (/[?&]hash/.test(location.search)) { $('#f').hidden = true; $('#tool').hidden = false }

$('#ver').onclick = () => { const p = $('#p'), v = p.type === 'password'; p.type = v ? 'text' : 'password'; $('#ver').textContent = v ? 'Ocultar' : 'Ver' };

$('#f').onsubmit = async e => {
  e.preventDefault(); error('');
  const bloqueo = +sessionStorage.getItem('cp_bloqueo') || 0;
  if (bloqueo > Date.now()) return error(`Demasiados intentos. Espera ${Math.ceil((bloqueo - Date.now()) / 1000)} segundos.`);
  if (!hayCrypto()) return error('Este navegador no permite validar aquí. Abre el archivo con Chrome o desde tu hosting (https).');
  const u = $('#u').value.trim().toLowerCase(), p = $('#p').value;
  $('#b').disabled = true;
  const ok = Object.prototype.hasOwnProperty.call(USUARIOS, u) && USUARIOS[u] === await sha(u + ':' + p);
  if (ok) {
    sessionStorage.removeItem('cp_fallos'); sessionStorage.removeItem('cp_bloqueo');
    const s = JSON.stringify({ u, exp: Date.now() + HORAS * 3600e3 });
    ($('#rec').checked ? localStorage : sessionStorage).setItem(KEY, s);
    location.replace(PANEL);
  } else {
    const n = (+sessionStorage.getItem('cp_fallos') || 0) + 1;
    sessionStorage.setItem('cp_fallos', n);
    if (n >= MAX_INTENTOS) { sessionStorage.setItem('cp_bloqueo', Date.now() + BLOQUEO_SEG * 1000); sessionStorage.setItem('cp_fallos', 0); error(`Demasiados intentos. Espera ${BLOQUEO_SEG} segundos.`) }
    else error('Usuario o contraseña incorrectos.');
    $('#p').value = ''; $('#p').focus(); $('#b').disabled = false;
  }
};

$('#tool').onsubmit = async e => {
  e.preventDefault();
  if (!hayCrypto()) return $('#out').textContent = 'Este navegador no permite generar el hash aquí. Usa Chrome.';
  const u = $('#tu').value.trim().toLowerCase(), p = $('#tp').value;
  if (!u || !p) return;
  $('#out').textContent = `'${u}': '${await sha(u + ':' + p)}',`;
};
</script>
