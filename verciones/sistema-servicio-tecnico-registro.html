<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catapu · Panel de Servicio Técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --ink:#2B2A28; --ink-soft:#787571;
  --line:#E8E4DB; --accent:#F5871F; --accent-ink:#FFFFFF;
  --blue:#29ABE2; --terracotta:#B84A24;
  --amber:#B4691E; --amber-bg:#FBEEDD; --green:#2F8F5B; --green-bg:#E4F3EA;
  --radius:3px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B19;--surface:#262523; --ink:#F1EFE9; --ink-soft:#ABA69C;
    --line:#3B3834; --accent:#F79A42; --accent-ink:#241000;
    --blue:#5FC2ED; --terracotta:#D46A3E;
    --amber:#E0A15C; --amber-bg:#332918; --green:#7FC298; --green-bg:#16281F;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1B19;--surface:#262523; --ink:#F1EFE9; --ink-soft:#ABA69C;
  --line:#3B3834; --accent:#F79A42; --accent-ink:#241000;
  --blue:#5FC2ED; --terracotta:#D46A3E;
  --amber:#E0A15C; --amber-bg:#332918; --green:#7FC298; --green-bg:#16281F;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;min-height:100vh;}
nav{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand img{height:52px;display:block;}
.brand .word{font-size:19px;font-weight:600;color:var(--ink);letter-spacing:.2px;margin-top:6px;}
.brand .row{display:flex;align-items:center;gap:8px;}
.brand span{display:block;color:var(--ink-soft);font-size:11.5px;}
.brand .stripe{height:3px;width:34px;margin-top:10px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--terracotta));}
.navitem{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;color:var(--ink-soft);border-left:3px solid transparent;font-size:13.5px;}
.navitem:hover{background:var(--bg);}
.navitem.active{color:var(--ink);border-left-color:var(--accent);background:var(--bg);font-weight:600;}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
.navitem.active .dot{background:var(--accent);}
.navitem .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
main{flex:1;padding:28px 32px 60px;overflow-x:auto;}
h1{font-size:19px;margin:0 0 4px;font-weight:700;color:var(--ink);}
.sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
input[type=search]{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-size:13px;min-width:220px;}
button{font-family:inherit;font-size:13px;cursor:pointer;}
.btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 16px;border-radius:var(--radius);font-weight:600;}
.btn:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:var(--radius);}
.btn-text{background:none;border:none;color:var(--ink-soft);padding:4px 6px;}
.btn-text:hover{color:var(--ink);}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;}
th{color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;background:var(--bg);}
tbody tr:hover{background:var(--bg);}
tbody tr{cursor:pointer;}
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface);}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.badge.pend{background:var(--amber-bg);color:var(--amber);}
.badge.ok{background:var(--green-bg);color:var(--green);}
.badge.neu{background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px 18px;cursor:pointer;}
.card:nth-child(2){border-left-color:var(--blue);}
.card:nth-child(3){border-left-color:var(--terracotta);}
.card:nth-child(4){border-left-color:var(--accent);}
.card .n{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--ink);}
.card .l{color:var(--ink-soft);font-size:12.5px;margin-top:4px;}
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.4);display:flex;justify-content:flex-end;z-index:50;}
.panel{width:min(440px,100%);background:var(--surface);height:100%;overflow-y:auto;padding:24px 26px 90px;border-left:1px solid var(--line);}
.panel h2{font-size:16px;margin:0 0 18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);font-family:inherit;font-size:13.5px;}
.field textarea{min-height:60px;resize:vertical;}
.panel-actions{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:0;background:var(--surface);padding-top:12px;}
.close-x{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--ink-soft);font-size:20px;line-height:1;padding:4px;}
.rel{position:relative;}
.state-msg{padding:60px 20px;text-align:center;color:var(--ink-soft);}
@media (max-width:720px){
  #app{flex-direction:column;}
  nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 8px;overflow-x:auto;gap:2px;}
  .brand{border-bottom:none;border-right:1px solid var(--line);padding:0 14px 0 4px;margin-bottom:0;margin-right:6px;flex:none;}
  .brand img{height:34px;}
  .brand .word{font-size:15px;margin-top:2px;}
  .brand span{display:none;}
  .brand .stripe{display:none;}
  .navitem{padding:8px 12px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
  .navitem.active{border-left:none;border-bottom-color:var(--accent);}
  main{padding:18px 16px 40px;}
  .cards{grid-template-columns:1fr 1fr;}
  .panel{width:100%;}
}
</style>
</head>
<body>
<div id="app"></div>

    {k:'apellido_paterno',l:'Apellido Paterno',t:'text'},
    {k:'apellido_materno',l:'Apellido Materno',t:'text'},
    {k:'direccion',l:'Dirección',t:'text'},
    {k:'num_contacto',l:'N° Contacto',t:'text'},

  inventario:{label:'Inventario de Equipos', fields:[

    {k:'imei2',l:'IMEI 2',t:'text'},

    {k:'estado',l:'Estado',t:'select',o:['Pendiente','Resuelto']},
    {k:'resolucion',l:'Resolución',t:'select',o:['','Devolución de dinero','Cambio de equipo']},
    {k:'recepciono_equipo',l:'Recepcionó Equipo',t:'select',o:['No','Sí']},
    {k:'entrego_inventario',l:'Entregó a Inventario/Adm.',t:'select',o:['No','Sí']},
    {k:'validacion',l:'Validación',t:'select',o:['No','Sí']},
    {k:'adj_nota_credito',l:'Adj. Nota de Crédito',t:'text'},
    {k:'imei_nuevo',l:'IMEI Nuevo (x Cambio)',t:'text'},
    {k:'adj_nota_credito_cambio',l:'Adjunta NC por Cambio',t:'text'},
    {k:'envio_almacen',l:'Envío a Almacén',t:'select',o:['No','Sí']},
  ], cols:['imei','nombre_cliente','orden_servicio','estado','resolucion'], badge:'estado'},
};
const ORDER = ['dashboard','clientes','ordenes','inventario','garantias'];

let db=null, dbState='loading'; // loading | ok | unavailable
let data = {clientes:[], ordenes:[], inventario:[], garantias:[]};
let active = 'dashboard';
let editing = null; // {mod, id, values}
let search = '';

function fieldLabel(mod,k){ return MODULES[mod].fields.find(f=>f.k===k)?.l || k; }

function badgeClass(val){
  if(!val) return 'neu';
  const v = val.toLowerCase();
  if(v.includes('pendiente')) return 'pend';
  if(v.includes('resuelto')||v.includes('finalizado')) return 'ok';
  return 'neu';
}

function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

      ${ORDER.map(m=>navItem(m)).join('')}
    </nav>
    <main>${mainContent()}</main>
  `;
  attachNavHandlers();
  if(active!=='dashboard') attachTableHandlers(active);
  if(editing) renderPanel();
}

function navItem(m){
  if(m==='dashboard'){
    return `<div class="navitem ${active==='dashboard'?'active':''}" data-nav="dashboard"><span class="dot"></span>Tablero</div>`;
  }
  const mod = MODULES[m];
  const n = data[m].length;
  return `<div class="navitem ${active===m?'active':''}" data-nav="${m}"><span class="dot"></span>${mod.label}<span class="count mono">${n}</span></div>`;
}

function mainContent(){
  if(dbState==='unavailable'){
    return `<div class="state-msg">No se pudo conectar al almacenamiento en vivo de este panel.<br>Ábrelo desde el enlace del artefacto (no en la vista previa del chat) para que los datos se guarden.</div>`;
  }
  if(active==='dashboard') return dashboardView();
  return moduleView(active);
}

function dashboardView(){
  const pendOrdenes = data.ordenes.filter(d=>d.estado==='Pendiente'||d.estado==='En proceso').length;
  const pendGarantias = data.garantias.filter(d=>d.estado==='Pendiente').length;
  return `
    <h1>Tablero</h1>
    <div class="sub">Vista general de las dos tiendas, taller y administración.</div>
    <div class="cards">
      ${cardHtml('clientes','Clientes registrados',data.clientes.length)}
      ${cardHtml('ordenes','Órdenes de servicio abiertas',pendOrdenes)}
      ${cardHtml('inventario','Equipos en inventario',data.inventario.length)}
      ${cardHtml('garantias','Casos de garantía pendientes',pendGarantias)}
    </div>
    <h1 style="font-size:15px;margin-bottom:10px;">Últimos casos de garantía</h1>
    ${recentGarantias()}
  `;
}
function cardHtml(mod,label,n){
  return `<div class="card" data-nav="${mod}"><div class="n mono">${n}</div><div class="l">${label}</div></div>`;
}
function recentGarantias(){
  const rows = [...data.garantias].slice(-6).reverse();
  if(!rows.length) return `<div class="empty">Aún no hay casos de garantía registrados.</div>`;
  return `<table><thead><tr><th>IMEI</th><th>Cliente</th><th>Orden</th><th>Estado</th></tr></thead><tbody>
    ${rows.map(r=>`<tr data-edit="garantias|${r.id}">
      <td class="mono">${esc(r.imei)}</td><td>${esc(r.nombre_cliente)}</td><td>${esc(r.orden_servicio)}</td>
      <td><span class="badge ${badgeClass(r.estado)}">${esc(r.estado||'—')}</span></td>
    </tr>`).join('')}
  </tbody></table>`;
}

function moduleView(mod){
  const M = MODULES[mod];
  let rows = data[mod];
  if(search.trim()){
    const q = search.toLowerCase();
    rows = rows.filter(r=>M.cols.some(c=>(r[c]||'').toString().toLowerCase().includes(q)));
  }
  return `
    <h1>${M.label}</h1>
    <div class="sub">${data[mod].length} registro(s)</div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar..." value="${esc(search)}">
      <button class="btn" data-new="${mod}">+ Nuevo registro</button>
    </div>
    ${rows.length ? tableHtml(mod, rows) : `<div class="empty">No hay registros todavía. Usa "Nuevo registro" para agregar el primero.</div>`}
  `;
}

function tableHtml(mod, rows){
  const M = MODULES[mod];
  return `<table><thead><tr>${M.cols.map(c=>`<th>${fieldLabel(mod,c)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr data-edit="${mod}|${r.id}">${M.cols.map(c=>{
      const val = r[c];
      if(c===M.badge) return `<td><span class="badge ${badgeClass(val)}">${esc(val||'—')}</span></td>`;
      return `<td>${esc(val ?? '—')}</td>`;
    }).join('')}</tr>`).join('')}
  </tbody></table>`;
}

function attachNavHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ active = el.dataset.nav; search=''; render(); });
  });
  document.querySelectorAll('[data-new]').forEach(el=>{
    el.addEventListener('click', ()=> openPanel(el.dataset.new, null));
  });
  const s = document.getElementById('search');
  if(s) s.addEventListener('input', e=>{ search = e.target.value; render(); document.getElementById('search').focus(); document.getElementById('search').setSelectionRange(search.length,search.length); });
}
function attachTableHandlers(){
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [mod,id] = el.dataset.edit.split('|');
      const row = data[mod].find(r=>r.id===id);
      openPanel(mod, row);
    });
  });
}

function openPanel(mod, row){
  editing = { mod, id: row?row.id:null, values: row? {...row} : {} };
  render();
}
function closePanel(){ editing=null; render(); }

function renderPanel(){
  const {mod, id, values} = editing;
  const M = MODULES[mod];
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `<div class="panel rel">
    <button class="close-x" id="closeX">&times;</button>
    <h2>${id? 'Editar registro':'Nuevo registro'} · ${M.label}</h2>
    <form id="editForm">
      ${M.fields.map(f=>fieldHtml(mod,f,values)).join('')}
      <div class="panel-actions">
        <button type="submit" class="btn">${id?'Guardar cambios':'Crear registro'}</button>
        <button type="button" class="btn-ghost" id="cancelBtn">Cancelar</button>
        ${id?`<button type="button" class="btn-text" id="delBtn" style="margin-left:auto;">Eliminar</button>`:''}
      </div>
    </form>
  </div>`;
  document.getElementById('app').appendChild(wrap);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closePanel(); });
  document.getElementById('closeX').addEventListener('click', closePanel);
  document.getElementById('cancelBtn').addEventListener('click', closePanel);
  document.getElementById('editForm').addEventListener('submit', e=>{ e.preventDefault(); saveForm(); });
  const delBtn = document.getElementById('delBtn');
  if(delBtn) delBtn.addEventListener('click', ()=> deleteDoc(mod,id));
}

function fieldHtml(mod,f,values){
  const v = values[f.k] ?? '';
  if(f.t==='select'){
    return `<div class="field"><label>${f.l}</label><select name="${f.k}">
      ${f.o.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${o===''?'—':esc(o)}</option>`).join('')}
    </select></div>`;
  }
  if(f.t==='textarea'){
    return `<div class="field"><label>${f.l}</label><textarea name="${f.k}">${esc(v)}</textarea></div>`;
  }
  return `<div class="field"><label>${f.l}</label><input type="${f.t}" name="${f.k}" value="${esc(v)}"></div>`;
}

async function saveForm(){
  const {mod,id} = editing;
  const form = document.getElementById('editForm');
  const fd = new FormData(form);
  const body = {};
  MODULES[mod].fields.forEach(f=> body[f.k] = fd.get(f.k) || '');
  if(!db){ closePanel(); return; }
  try{
    if(id){ await db.collection(collectionName(mod)).doc(id).set(body); }
    else { await db.collection(collectionName(mod)).add(body); }
  }catch(err){ console.error(err); alert('No se pudo guardar el registro.'); }
  closePanel();
}
async function deleteDoc(mod,id){
  if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
  if(!db){ closePanel(); return; }
  try{ await db.collection(collectionName(mod)).doc(id).delete(); }
  catch(err){ console.error(err); alert('No se pudo eliminar el registro.'); }
  closePanel();
}
function collectionName(mod){
  return {clientes:'clientes',ordenes:'ordenes_servicio',inventario:'inventario',garantias:'garantias'}[mod];
}

async function init(){
  render();
  db = await claude.use('db').catch(()=>null);
  if(!db){ dbState='unavailable'; render(); return; }
  dbState='ok';
  Object.keys(data).forEach(mod=>{
    db.collection(collectionName(mod)).onSnapshot(
      snap=>{ data[mod] = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); },
      err=>{ console.error(mod, err); }
    );
  });
}
init();
</script>
</body>
